name: Gold Price Tracker
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pandas
      - name: Run scraper
        run: python main.py
      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # ファイルが存在するか確認してから追加
          if [ -f gold_price.csv ]; then
            git add gold_price.csv
            # 変更がある場合のみコミット
            git diff --quiet && git diff --staged --quiet || (git commit -m "Update gold price" && git push)
          else
            echo "gold_price.csv not found!"
            exit 1
          fi
